name: Features
description: Suggest a feature for AEmulator
labels: ["enhancement"]
body:
  - type: input
    id: feature
    attributes: { label: Feature, description: "What would you like to see added?" }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Guest firmware", "Import and firmware support", "User interface", "Settings", "Other"]
    validations: { required: true }
  - type: textarea
    id: details
    attributes: { label: Details, description: "How should it work? Add examples or screenshots if you have them." }
  - type: input
    id: version
    attributes: { label: App version, placeholder: "0.0.0.3.31" }
